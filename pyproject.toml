[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "letto-pluginpython-shared"
version = "0.1.0"
description = "Shared execution, grading and formatting helpers for LeTTo plugins"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic==2.14.0",
    "pylint==4.1.2",
    "ruff==0.17.0",
    "clang-format==23.1.3",
    "sqlparse==0.6.0",
]

[project.urls]
Repository = "https://github.com/klausstocker/plugin-python"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.hatch.build.targets.wheel.force-include]
"examples/Python" = "shared/_data/examples/Python"
"examples/CPP" = "shared/_data/examples/CPP"
"examples/SQL" = "shared/_data/examples/SQL"
"resources/plugins/Cpp/helpers.h" = "shared/_data/helpers.h"
"resources/plugins/Cpp/helpers.c" = "shared/_data/helpers.c"

[tool.hatch.build.targets.sdist]
include = [
    "/pyproject.toml",
    "/README.md",
    "/shared",
    "/examples/Python",
    "/examples/CPP",
    "/examples/SQL",
    "/resources/plugins/Cpp/helpers.h",
    "/resources/plugins/Cpp/helpers.c",
]
