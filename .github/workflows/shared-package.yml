name: Installed shared package

on:
  push:
    branches: [master]
  pull_request:

jobs:
  installed-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install build
      # build creates the wheel from the sdist, checking both distribution formats.
      - run: python -m build
      - run: python -m pip install -r requirements.txt dist/*.whl
      - run: python -m pip check
      - run: python scripts/test_installed_package.py
